[project]
name = "aifs-env"
version = "0.1"
requires-python = ">=3.12,<3.13"
# Pins from ecmwf/aifs-single-2.0 pyproject.toml, except torch (2.7 has known CVEs; 2.14.1 has none, see DECISIONS.md). DGX Spark (aarch64, GB10): CUDA torch 2.14.1+cu130 from
# pytorch.org; flash-attn has no aarch64 wheel, see DECISIONS.md for what runs instead.
dependencies = [
  "anemoi-graphs==0.6.4",
  "anemoi-models==0.9.3",
  "anemoi-transform==0.1.16.post2",
  "anemoi-utils==0.4.35.post3",
  "earthkit-data<1",
  "torch==2.14.1",
  "torch-geometric==2.6.1",
  "anemoi-inference[huggingface]==0.8.3",
  "anemoi-plugins-ecmwf-inference[opendata]==0.2.1",
  "earthkit-regrid==0.5.1",
  "ecmwf-opendata==0.3.29",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
