[project]
name = "judge-env"
version = "0.1"
requires-python = ">=3.12,<3.13"
# DGX Spark (aarch64, GB10): CUDA torch from pytorch.org (Ollama's strands-decider needs MLX, not on Linux arm64).
dependencies = ["strands-decider==0.2.0", "torch==2.14.1"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
