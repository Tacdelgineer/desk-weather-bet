[project]
name = "judge-env"
version = "0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["strands-decider[cpu]", "torch"]

[tool.uv]
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
